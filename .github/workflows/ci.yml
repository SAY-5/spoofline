name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the project
        run: uv sync
      - name: Lint
        run: |
          uv run ruff check spoofline tests
          uv run ruff format --check spoofline tests
      - name: Tests on the tiny fixture corpus
        run: uv run pytest
      - name: Smoke run of the whole pipeline
        run: uv run spoofline pipeline --profile tiny
